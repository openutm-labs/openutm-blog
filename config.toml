baseURL = "https://blog.openutm.com/"
languageCode = "en-us"
title = "OpenUTM"
theme = "hugo-ink"

copyright = "OpenUTM Limited. All rights reserved."

# Modern Comment Configuration (Replaces old Disqus structure)
[comment]
  [comment.disqus]
    shortname = "" # Leave blank or insert your Disqus shortname here

# Modern Pagination Configuration (Replaces paginate = 10)
[pagination]
  pagerSize = 10

# Modern Markup / Raw HTML Configuration (Fixes the Goldmark warning)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Number of characters to show in summary.
summaryLength = 25

[params]
    # Content types which are included in home page recent posts list.
    mainSections = ["articles"]

    # Content types which are excludes Disqus comments.
    disableDisqusTypes = ["page", "post"]

    # If social media links are enabled then enable this to fetch icons from CDN instead of hosted on your site.
    featherIconsCDN = true

    # Specify favicon (icons/i.png maps to static/icons/i.png). No favicon if not defined.
    favicon = "/icons/favicon.ico"

    # Switch to dark mode or auto detect mode from OS.
    mode = "auto" 

# Main menu which appears below site header.
[[menu.main]]
name = "All Articles"
url = "/articles"
weight = 1

[[menu.main]]
name = "Categories"
url = "/categories"
weight = 2

[[menu.main]]
name = "About OpenUTM"
url = "https://www.openutm.com"
weight = 3

# Social media links which shows up on site header.
[[params.social]]
name = "Home"
icon = "globe"
url = "https://www.openutm.com"

[[params.social]]
name = "Github"
icon = "github"
url = "https://github.com/openutm"

# Enable tags.
[taxonomies]
   category = "categories"
